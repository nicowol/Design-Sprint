<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#dff4f0" />
    <title>College Quest Roadmap</title>
    <meta
      name="description"
      content="A five-world roadmap through the college admissions process."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@500;600;700&family=Fraunces:opsz,wght@9..144,650;9..144,750&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main>
      <section id="home" class="page home active">
        <div class="home-copy">
          <p>YOUR COLLEGE ROADMAP</p>
          <h1>Five worlds.<br />One clear path.</h1>
          <span
            >Choose a world to explore and take the next step toward
            college.</span
          >
        </div>
        <div class="world-grid" id="world-grid"></div>
      </section>
      <section id="world" class="page world">
        <div class="terrain" id="terrain">
          <div class="atmosphere"></div>
          <div class="world-heading">
            <button id="back-btn">← World map</button>
            <p id="world-kicker"></p>
            <h1 id="world-title"></h1>
            <span id="world-summary"></span>
          </div>
          <div class="path-wrap">
            <svg
              id="road"
              viewBox="0 0 2500 430"
              preserveAspectRatio="xMidYMid meet"
            >
              <path
                id="road-path"
                d="M70 290 C380 91 680 83 880 223 C1080 376 1380 364 1560 198 C1720 58 2100 74 2400 231"
              />
            </svg>
            <div id="nodes"></div>
          </div>
          <aside class="hud">
            <div>
              <span>WORLD PROGRESS</span><b id="progress-count"></b
              ><i><em id="progress-bar"></em></i>
            </div>
            <div class="next">
              <span>NEXT NODE</span>
              <h3 id="next-node"></h3>
              <button id="continue-btn">Continue</button>
            </div>
            <button id="college-list-btn">
              My college list <b id="list-count">0</b>
            </button>
          </aside>
          <nav class="world-switcher" id="world-switcher"></nav>
        </div>
      </section>
    </main>
    <dialog id="node-dialog">
      <button class="close">×</button>
      <div id="node-content"></div>
    </dialog>
    <dialog id="panel-dialog">
      <button class="close">×</button>
      <div id="panel-content"></div>
    </dialog>
    <div id="toast"></div>
    <script src="app.js"></script>
    <script src="enhancements.js"></script>
  </body>
</html>
